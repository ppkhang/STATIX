name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # the build never connects; the app only needs the variable to exist
      DATABASE_URL: postgres://statix:statix@localhost:5432/statix
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # node:crypto argon2 needs 24.7 or newer
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
