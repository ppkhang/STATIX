# Local Postgres for development only. Matches DATABASE_URL in .env.example.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: statix
      POSTGRES_PASSWORD: statix
      POSTGRES_DB: statix
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
